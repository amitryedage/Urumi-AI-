{{- $name := include "store.dbHost" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: mariadb
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mariadb
          image: "{{ .Values.mariadb.image.repository }}:{{ .Values.mariadb.image.tag }}"
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          securityContext: {{- include "store.containerSecurity" . | nindent 12 }}
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: db-password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: db-root-password } }
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec: { command: ["healthcheck.sh", "--connect", "--innodb_initialized"] }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["healthcheck.sh", "--connect"] }
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources: {{- toYaml .Values.mariadb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: run
              mountPath: /run/mysqld
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.mariadb.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
