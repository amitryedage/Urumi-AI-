{{- if .Values.mcp.enabled }}
{{- $name := printf "%s-woo-mcp" (include "store.name" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
spec:
  # ClusterIP only: no Ingress/NodePort. NetworkPolicy additionally limits callers to the gateway.
  type: ClusterIP
  selector: {{- include "store.selector" (dict "root" . "component" "woo-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "store.labels" . | nindent 4 }}
    app.kubernetes.io/component: woo-mcp
spec:
  replicas: {{ .Values.mcp.replicas }}
  selector:
    matchLabels: {{- include "store.selector" (dict "root" . "component" "woo-mcp") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "store.labels" . | nindent 8 }}
        app.kubernetes.io/component: woo-mcp
        mcp-gateway/upstream: "true"     # gateway egress policy allows only labelled upstreams
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: woo-mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          securityContext: {{- include "store.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          env:
            - name: PORT
              value: "8080"
            - name: STORE_NAME
              value: {{ .Values.store.title | quote }}
            - name: WC_BASE_URL       # internal Service, never the public URL
              value: http://{{ include "store.wpHost" . }}
            - name: WC_SITE_URL       # used only to compute the OAuth 1.0a signature base
              value: {{ .Values.store.siteUrl | quote }}
            - name: WC_TIMEOUT_MS
              value: {{ .Values.mcp.timeoutMs | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: wc-consumer-key } }
            - name: WC_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: wc-consumer-secret } }
            - name: MCP_AUTH_TOKEN    # the gateway's credential for this server
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: mcp-token } }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}
