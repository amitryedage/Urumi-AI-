{{- if .Values.ingress.enabled }}
# One host: the SPA at /, the gateway's REST API at /api and the MCP endpoint at /mcp.
# Same origin means session cookies need no CORS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "gw.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-gateway, port: { name: http } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ .Release.Name }}-dashboard, port: { name: http } } }
{{- end }}
